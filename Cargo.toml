[package]
name = "n8n-rust-v5"
version = "0.2.0"
edition = "2021"
authors = ["Catzpro01"]
description = "High-performance single-crate Rust implementation of n8n engine & Axum UI server"
build = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-full", "trace"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
rusqlite = { version = "0.33", features = ["bundled"] }
zstd = "0.13"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
dashmap = "6.1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
flatted = "0.2.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.dev]
opt-level = 1
debug = 0

[profile.test]
opt-level = 1
debug = 0

